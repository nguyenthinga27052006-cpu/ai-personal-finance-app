name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: none

env:
  PYTHON_VERSION: "3.13"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: finance
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend
        working-directory: apps/api
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        working-directory: apps/api
        run: ruff check app tests
      - name: Compile
        run: python -m compileall -q apps/api/app apps/worker/app
      - name: Test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://finance:finance-ci-password@localhost:5432/finance
          HOST_DATABASE_URL: postgresql://finance:finance-ci-password@localhost:5432/finance
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-secret-change-me-32-bytes
          NOTIFICATION_WORKER_TOKEN: ci-worker-token
        run: python -m pytest --junitxml=../../artifacts/backend-junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: backend-test-report, path: artifacts/backend-junit.xml}

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml
      - name: Install worker
        working-directory: apps/worker
        run: pip install .
      - name: Compile worker
        run: python -m compileall -q apps/worker/app

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.47.1", channel: stable, cache: true}
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test
      - working-directory: apps/mobile
        run: flutter build apk --debug

  containers:
    runs-on: ubuntu-latest
    needs: [backend, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag finance-assistant-api:${{ github.sha }} apps/api
      - name: Build worker image
        run: docker build --tag finance-assistant-worker:${{ github.sha }} apps/worker
      - name: Generate image metadata
        run: docker image inspect finance-assistant-api:${{ github.sha }} finance-assistant-worker:${{ github.sha }} > image-metadata.json
      - uses: actions/upload-artifact@v4
        with: {name: image-metadata, path: image-metadata.json}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install API dependencies for audit
        working-directory: apps/api
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Dependency audit
        working-directory: apps/api
        run: pip-audit --strict
