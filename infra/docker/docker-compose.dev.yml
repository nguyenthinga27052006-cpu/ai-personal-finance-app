services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env first}
      REDIS_URL: ${REDIS_URL:?Copy .env.example to .env first}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env first}
      JWT_ISSUER: ${JWT_ISSUER:-ai-personal-finance-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-personal-finance-mobile}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_SESSION_TTL_DAYS: ${REFRESH_SESSION_TTL_DAYS:-30}
      NOTIFICATION_WORKER_TOKEN: ${NOTIFICATION_WORKER_TOKEN:-development-worker-token}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ../../apps/worker
    environment:
      REDIS_URL: ${REDIS_URL:?Copy .env.example to .env first}
      API_URL: http://api:8000
      NOTIFICATION_WORKER_TOKEN: ${NOTIFICATION_WORKER_TOKEN:-development-worker-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-finance-assistant}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-finance-assistant}_redis_data
